name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '21 7 * * 1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Verify module manifests and checksums
        run: |
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Formatting, vet, tests and builds
        run: |
          make check
          make linux
          test -z "$(go list -deps -f '{{if .CgoFiles}}{{.ImportPath}}{{end}}' ./cmd/wolfy)"
      - name: Local demo and offline maintenance
        run: make smoke
      - name: Vulnerability scan
        run: make audit
